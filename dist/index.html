<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spinoza</title>

  <style>*{box-sizing:border-box}body{color:#222;margin:0;font-family:Arial,sans-serif}#controls{z-index:10;background:#fff;border-bottom:1px solid #ddd;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;display:flex;position:sticky;top:0}#controls strong{margin-right:5px}#controls label{white-space:nowrap}#controls hr{border:0;border-top:1px solid #ddd;width:100%;margin:2px 0}#controls button{cursor:pointer;padding:5px 10px}#graph{background:#fff;width:100%;overflow:auto}#graph svg{display:block}.node{cursor:pointer}#demonstration-panel{background:#fafafa;border:1px solid #ddd;border-radius:8px;max-width:1000px;margin:30px auto;padding:24px;line-height:1.6}#demonstration-panel[hidden]{display:none}#demonstration-title{margin:0 0 20px;font-size:22px}.demonstration{margin-bottom:24px}.demonstration:last-child{margin-bottom:0}.demonstration h3{margin:0 0 8px;font-size:17px}.demonstration p{white-space:normal;margin:0}</style>
  <script type="module" crossorigin src="/ethics.github.io/assets/index-DCkG8HxV.js"></script>
</head>

<body>

  <div id="controls">
    <strong>Display types</strong>

    <label>
      <input type="checkbox" data-type="proposition" checked>
      Propositions
    </label>

    <label>
      <input type="checkbox" data-type="corollary" checked>
      Corollaries
    </label>

    <label>
      <input type="checkbox" data-type="scolie" checked>
      Scolies
    </label>

    <label>
      <input type="checkbox" data-type="definition" checked>
      Definitions
    </label>

    <label>
      <input type="checkbox" data-type="lemma" checked>
      Lemmas
    </label>

    <label>
      <input type="checkbox" data-type="axiom" checked>
      Axioms
    </label>

    <label>
      <input type="checkbox" data-type="postulate" checked>
      Postulates
    </label>

    <button id="show-none" type="button">None</button>
    <button id="show-all" type="button">All</button>

    <hr>

    <strong>Display parts</strong>

    <label>
      <input type="checkbox" data-part="1" checked>
      Part I
    </label>

    <label>
      <input type="checkbox" data-part="2" checked>
      Part II
    </label>

    <label>
      <input type="checkbox" data-part="3" checked>
      Part III
    </label>

    <label>
      <input type="checkbox" data-part="4" checked>
      Part IV
    </label>

    <label>
      <input type="checkbox" data-part="5" checked>
      Part V
    </label>

    <button id="parts-none" type="button">None</button>
    <button id="parts-all" type="button">All</button>
  </div>

  <div id="demonstration-panel" hidden>
    <h2 id="demonstration-title"></h2>
    <div id="demonstration-content"></div>
  </div>

  <div id="graph"></div>


</body>
</html>
